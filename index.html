    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tile Calculator",
        "url": "https://tile-calculator.correia95.workers.dev/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AUD" },
        "description": "Estimate the number of tiles for a floor or wall, allowing for grout joints and wastage, with adhesive and grout quantities."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I calculate how many tiles I need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Divide the area to be tiled by the effective size of one tile, which is the tile size plus one grout joint on two sides. Then add a wastage percentage for cuts and breakages and round up to whole boxes. A 12 square metre floor in 600 by 600 tiles with 3 mm joints and 10 percent wastage needs about 37 tiles."
            }
          },
          {
            "@type": "Question",
            "name": "How much wastage should I allow for tiles?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "About 10 percent for a straight lay in a square room, 15 percent for a diagonal lay or lots of cuts or large-format tiles, and 20 percent or more for herringbone and other complex patterns. Always keep a few spares from the same batch."
            }
          },
          {
            "@type": "Question",
            "name": "How much tile adhesive and grout will I need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Adhesive is roughly one 20 kg bag per 4 square metres with a 6 mm notched trowel. Grout use rises sharply as tiles get smaller: a 600 mm tile might use a quarter of a kilo per square metre while a mosaic uses several times that."
            }
          },
          {
            "@type": "Question",
            "name": "Does this work for wall tiles?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Enter the wall area, which is height times length, and subtract windows and any area behind a vanity or bath that will not be tiled. Check the tiles-per-box figure on the actual wall tile as it differs from floor tiles."
            }
          }
        ]
      }
    </script>
